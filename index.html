<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #ffeff3; }
        h1 { color: #d63384; margin-bottom: 20px; }
        .buttons { position: relative; width: 300px; height: 100px; }
        button { padding: 10px 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; position: absolute; }
        #yes { background-color: #28a745; color: white; top: 0; left: 0; }
        #no { background-color: #dc3545; color: white; top: 0; right: 0; }
    </style>
</head>
<body>
    <h1 id="question">Will you go on a date with me?</h1>
    <div class="buttons">
        <button id="yes" onclick="nextStep()">Yes</button>
        <button id="no" onmouseover="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            var btn = document.getElementById("no");
            var x = Math.random() * 200 - 100;
            var y = Math.random() * 200 - 100;
            btn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
        }
        function nextStep() {
            document.getElementById("question").innerHTML = "Yay! See you on our date!";
            document.getElementById("yes").style.display = 'none';
            document.getElementById("no").style.display = 'none';
        }
    </script>
</body>
</html>
