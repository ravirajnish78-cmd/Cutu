<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be Mine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center; font-family: 'Poppins', sans-serif; height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            margin: 0; overflow: hidden;
        }
        h1 { color: #fff; font-size: 3rem; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        button {
            padding: 15px 30px; font-size: 18px; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        #yes { background-color: #ffffff; color: #ff6a6a; }
        #yes:hover { transform: scale(1.1); }
        #no { background-color: #4a4a4a; color: white; }
        #step2, #step3, #step4 { display: none; }
        .option-btn { background-color: #ffffff; color: #ff6a6a; margin: 10px; padding: 15px 25px; border-radius: 30px; border: none; cursor: pointer; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .option-btn:hover { transform: scale(1.05); }
        .quote { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #fff; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="step1">
        <h1>Will you go on a date with me?</h1>
        <div class="buttons">
            <button id="yes" onclick="nextStep(2)">Yes</button>
            <button id="no" onclick="handleNo()">No</button>
        </div>
    </div>

    <div id="step2">
        <h1>Which date works for you?</h1>
        <button class="option-btn" onclick="nextStep(4)">This Saturday (Sept 5)</button>
        <button class="option-btn" onclick="nextStep(4)">This Sunday (Sept 6)</button>
        <button class="option-btn" onclick="nextStep(4)">Next Saturday (Sept 12)</button>
        <button class="option-btn" onclick="nextStep(3)">Surprise Date!</button>
    </div>

    <div id="step3">
        <h1>What's the plan for our Surprise Date?</h1>
        <button class="option-btn" onclick="nextStep(4)">Movie Night</button>
        <button class="option-btn" onclick="nextStep(4)">Clubbing & Dancing</button>
        <button class="option-btn" onclick="nextStep(4)">Singing Together</button>
        <button class="option-btn" onclick="nextStep(4)">Quality Time</button>
    </div>

    <div id="step4">
        <h1>You are my world!</h1>
        <p class="quote">"In your smile, I see something more beautiful than the stars. And with you, every moment is a precious memory."</p>
    </div>

    <script>
        const noMessages = [
            "Are you sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "Don't break my heart!",
            "Please say Yes!"
        ];
        let messageIndex = 0;

        function handleNo() {
            var yesBtn = document.getElementById("yes");
            var noBtn = document.getElementById("no");
            
            var currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize + 10) + 'px';
            yesBtn.style.padding = (15 + messageIndex*5) + 'px ' + (30 + messageIndex*10) + 'px';

            if (messageIndex < noMessages.length) {
                noBtn.innerHTML = noMessages[messageIndex];
                messageIndex++;
            } else {
                noBtn.innerHTML = "Bas, ab Yes bolo!";
            }
        }

        function nextStep(step) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step4').style.display = 'none';
            
            var nextStepDiv = document.getElementById('step' + step);
            nextStepDiv.style.display = 'flex';
            nextStepDiv.style.flexDirection = 'column';
            nextStepDiv.style.justifyContent = 'center';
            nextStepDiv.style.alignItems = 'center';
            nextStepDiv.style.height = '100vh';
        }
    </script>
</body>
</html>
