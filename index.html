<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center; font-family: 'Poppins', sans-serif; height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0; overflow: hidden;
        }
        h1 { color: #fff; font-size: 3rem; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .buttons { position: relative; width: 400px; height: 100px; display: flex; justify-content: center; gap: 50px; }
        button {
            padding: 15px 30px; font-size: 20px; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        #yes { background-color: #ffffff; color: #ff6a6a; }
        #yes:hover { transform: scale(1.1); background-color: #fff0f0; }
        #no { background-color: #ff6a6a; color: white; position: absolute; }
    </style>
</head>
<body>
    <h1 id="question">Will you go on a date with me?</h1>
    <div class="buttons">
        <button id="yes" onclick="nextStep()">Yes</button>
        <button id="no" onmouseover="moveButton()">No</button>
    </div>

    <script>
        const noMessages = [
            "Are you sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "Don't break my heart!"
        ];
        let messageIndex = 0;
        let yesSize = 20;

        function moveButton() {
            var btn = document.getElementById("no");
            var x = Math.random() * (window.innerWidth - 100);
            var y = Math.random() * (window.innerHeight - 100);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            var yesBtn = document.getElementById("yes");
            yesSize += 10;
            yesBtn.style.fontSize = yesSize + 'px';

            if (messageIndex < noMessages.length) {
                btn.innerHTML = noMessages[messageIndex];
                messageIndex++;
            } else {
                btn.innerHTML = "Okay, fine!";
            }
        }
        function nextStep() {
            document.getElementById("question").innerHTML = "Yay! See you on our date!";
            document.querySelector('.buttons').style.display = 'none';
            document.body.style.background = "linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%)";
        }
    </script>
</body>
</html>
