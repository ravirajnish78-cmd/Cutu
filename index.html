<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special Someone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center; font-family: 'Poppins', sans-serif; height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: linear-gradient(135deg, #ffb3c1 0%, #ffc8dd 100%);
            margin: 0; overflow: hidden;
        }
        h1 { color: #fff; font-size: 3rem; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .buttons { position: relative; width: 450px; height: 100px; display: flex; justify-content: center; }
        button {
            padding: 15px 30px; font-size: 20px; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: 600; position: absolute;
        }
        #yes { background-color: #ffffff; color: #ff4d6d; }
        #no { background-color: #4a4a4a; color: white; right: 100px; }
        #step2, #step3, #step4 { display: none; }
        .option-btn { background-color: #ffffff; color: #ff4d6d; margin: 10px; padding: 15px 25px; border-radius: 30px; border: none; cursor: pointer; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .quote { font-family: 'Great Vibes', cursive; font-size: 2.5rem; color: #fff; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="step1">
        <h1 id="question">Will you go on a date with me?</h1>
        <div class="buttons">
            <button id="yes" onclick="nextStep(2)">Yes</button>
            <button id="no" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <div id="step2">
        <h1>Which date works for you?</h1>
        <button class="option-btn" onclick="nextStep(3)">This Saturday?</button>
        <button class="option-btn" onclick="nextStep(3)">This Sunday?</button>
        <button class="option-btn" onclick="nextStep(4)">Surprise Date! (Choose this)</button>
    </div>

    <div id="step3">
        <h1>What's the plan?</h1>
        <button class="option-btn" onclick="nextStep(5)">Movie Night</button>
        <button class="option-btn" onclick="optionSelected()">Clubbing</button>
        <button class="option-btn" onclick="optionSelected()">Dancing</button>
        <button class="option-btn" onclick="optionSelected()">Singing</button>
    </div>

    <div id="step4">
        <h1>I want to give you a special time...</h1>
        <button class="option-btn" onclick="nextStep(5)">Quality Time</button>
    </div>

    <div id="step5">
        <h1>You are my world!</h1>
        <p class="quote">"In your smile, I see something more beautiful than the stars. And with you, every moment is a precious memory."</p>
    </div>

    <script>
        const noMessages = [
            "Please select Yes!",
            "Select Yes, please?",
            "Bol do na Yes!",
            "Yes bol do na, please!",
            "Don't break my heart!"
        ];
        let messageIndex = 0;
        let yesSize = 20;

        function moveNo() {
            var btn = document.getElementById("no");
            var x = Math.random() * (window.innerWidth - 100);
            var y = Math.random() * (window.innerHeight - 100);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            var yesBtn = document.getElementById("yes");
            yesSize += 5;
            yesBtn.style.fontSize = yesSize + 'px';

            if (messageIndex < noMessages.length) {
                btn.innerHTML = noMessages[messageIndex];
                messageIndex++;
            } else {
                btn.innerHTML = "Bas, ab Yes bolo!";
            }
        }

        function nextStep(step) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step4').style.display = 'none';
            document.getElementById('step5').style.display = 'none';
            
            document.getElementById('step' + step).style.display = 'flex';
            document.getElementById('step' + step).style.flexDirection = 'column';
            document.getElementById('step' + step).style.justifyContent = 'center';
            document.getElementById('step' + step).style.alignItems = 'center';
            document.getElementById('step' + step).style.height = '100vh';
        }

        function optionSelected() {
            nextStep(5);
        }
    </script>
</body>
</html>
